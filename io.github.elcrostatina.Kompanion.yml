id: io.github.elcrostatina.Kompanion
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
command: kompanion
separate-locales: false
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.kde.kglobalaccel
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd6
  - --env=QTWEBENGINE_DISABLE_SANDBOX=1
cleanup-commands:
  - /app/cleanup-BaseApp.sh
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
modules:
  - name: qtkeychain
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_WITH_QT6=ON
      - -DBUILD_TEST_APPLICATION=OFF
      - -DBUILD_TRANSLATIONS=OFF
    sources:
      - type: git
        url: https://github.com/frankosterfeld/qtkeychain.git
        tag: 0.16.0
        commit: aa6da344e1a20b9194e12bace3665caeea6b6304
  - name: layer-shell-qt
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://invent.kde.org/plasma/layer-shell-qt.git
        tag: v6.8.3
        commit: aec8e40027e62823d8e1ac696f9f593715c74965
  - name: kompanion
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DKOMPANION_BUILD_TESTS=OFF
    sources:
      - type: dir
        path: .
        skip:
          - build
          - .git
          - .flatpak-builder
