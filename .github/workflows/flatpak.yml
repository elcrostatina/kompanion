name: Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ID: io.github.elcrostatina.Kompanion
  MANIFEST: io.github.elcrostatina.Kompanion.yml
  FLATHUB_REPO: https://dl.flathub.org/repo/flathub.flatpakrepo

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Allow user namespaces for the build sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Add Flathub
        run: flatpak remote-add --user --if-not-exists flathub "$FLATHUB_REPO"

      - name: Restore the runtime cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-${{ matrix.arch }}-${{ hashFiles(env.MANIFEST) }}
          restore-keys: flatpak-runtimes-${{ matrix.arch }}-

      - name: Install the runtimes
        run: |
          runtime=$(sed -n "s/^runtime-version: '\(.*\)'/\1/p" "$MANIFEST")
          flatpak install --user -y --noninteractive flathub \
            org.kde.Platform//$runtime org.kde.Sdk//$runtime io.qt.qtwebengine.BaseApp//$runtime

      - name: Build the application
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=repo --state-dir=.flatpak-builder build-dir "$MANIFEST"

      - name: Create the bundle
        run: |
          flatpak build-bundle repo kompanion-${{ matrix.arch }}.flatpak "$APP_ID" master \
            --runtime-repo="$FLATHUB_REPO"

      - uses: actions/upload-artifact@v4
        with:
          name: kompanion-${{ matrix.arch }}
          path: kompanion-${{ matrix.arch }}.flatpak
          if-no-files-found: error

  release:
    name: Attach bundles to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kompanion-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: kompanion-*.flatpak
          generate_release_notes: true
